[package]
name = "agentdb-mid"
version = "0.1.0"
edition = "2021"
description = "中间层 Agent 原型：共享 · 守护 · 反馈（Agent 与数据库之间）"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
dotenvy = "0.15"
futures = "0.3"
parking_lot = "0.12"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"

[profile.release]
debug = false
opt-level = 2
